[package]
name = "deuxfleurs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytemuck = { version = "1.12.1", features = ["derive"] }
cfg-if = "1.0.0"
glam = { version = "0.30", features = ["serde"] }
egui = "0.31"
transform-gizmo-egui = "0.6"
egui-wgpu = { version = "0.31", features = ["winit"] }
egui-winit = { version = "0.31", default-features = false }
egui_plot = "0.32"
epaint = "0.31"
env_logger = { version = "0.9.1", optional = true }
image = { version = "0.24.4", default-features = false, features = ["png"] }
log = "0.4.17"
oneshot = "0.1.5"
pollster = "0.2.5"
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }
wgpu = { version = "24", features = ["serde"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
ndarray = { version = "0.15", optional = true }
nalgebra = { version = "0.32", optional = true }
indexmap = { version = "2.2.3", features = ["serde"] }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
memchr = "2.7.4"
atoi_radix10 = { version = "0.0.1", features = ["simd"] }
num-traits = "0.2.19"
serde_cbor = "0.11.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.31", default-features = false, features = [
    "clipboard",
] }

[features]
default = ["x11"]
ndarray = ["dep:ndarray"]
nalgebra = ["dep:nalgebra"]
obj_button = []                                                           # ["dep:rfd"]
logger = ["dep:env_logger"]
x11 = ["egui-winit/x11", "winit/x11"]
wayland = ["egui-winit/wayland", "winit/wayland", "winit/wayland-dlopen"]

[[example]]
name = "load_filter"
path = "examples/load_filter.rs"
required-features = ["obj_button"]

# WASM specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "0.2.0"
getrandom = { version = "0.2", features = ["js"] }
wgpu = { version = "=24", default-features = false, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.64", features = [
    "Document",
    "Window",
    "Element",
    "Location",
    "Clipboard",
    "Request",
    "RequestMode",
    "RequestInit",
    "Response",
] }
js-sys = "0.3.64"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
